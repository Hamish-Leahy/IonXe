version: '3.8'
services:
  backend:
    build: ./services/backend
    ports:
      - "8080:8080"
    volumes:
      - ./build/state:/app/build/state
  backend-c:
    build: ./services/backend-c
    ports:
      - "8081:8081"
    volumes:
      - ./build/state:/app/build/state
  middleware:
    build: ./services/middleware
    environment:
      - BACKEND_RS=http://backend:8080
      - BACKEND_C=http://backend-c:8081
    ports:
      - "8082:8082"
    depends_on:
      - backend
      - backend-c
  frontend:
    build: ./services/frontend
    ports:
      - "8083:80"
    depends_on:
      - middleware
  ai-lighting:
    build: ./services/ai-lighting
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-your-mistral-api-key}
      - AUGMENT3D_ENDPOINT=http://frontend:80
      - BACKEND_URL=http://middleware:8082
    ports:
      - "8084:8084"
    depends_on:
      - middleware


