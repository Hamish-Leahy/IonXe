[package]
name = "ionxe-ai-lighting"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
reqwest = { version = "0.11", features = ["json"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.21"
image = "0.24"
ffmpeg-next = "6.0"
rodio = "0.17"
hound = "3.5"
midly = "0.5"
rustfft = "6.1"
ndarray = "0.15"
ndarray-npy = "0.8"
# Mistral AI dependencies
candle-core = "0.3"
candle-nn = "0.3"
candle-transformers = "0.3"
candle-datasets = "0.3"
# Audio processing for music analysis
cpal = "0.15"
rubato = "0.14"
# 3D graphics for Augment 3D integration
wgpu = "0.18"
winit = "0.29"
bytemuck = "1.14"
# Additional ML utilities
ndarray = "0.15"
ndarray-npy = "0.8"
